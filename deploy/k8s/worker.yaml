# DEMO FIXTURE. Upstream images on purpose. See ../../README.md.
#
# Added in the same pull request as apps/12-worker so Image Suggestions has a
# YAML surface to comment on, not just a Dockerfile.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-worker
  namespace: northwind
  labels:
    app.kubernetes.io/name: settlement-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: settlement-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: settlement-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: python:3.12-slim
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SETTLEMENT_QUEUE
              value: northwind:settlements
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

        - name: queue-metrics
          image: oliver006/redis_exporter:v1.62.0
          ports:
            - name: metrics
              containerPort: 9121
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: northwind
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
