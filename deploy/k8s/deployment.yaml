# DEMO FIXTURE. Upstream images on purpose. See ../../README.md.
#
# Guardener reads literal `image:` values in Kubernetes manifests, including
# initContainers and sidecars.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: northwind-edge
  namespace: northwind
  labels:
    app.kubernetes.io/name: northwind-edge
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: northwind-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: northwind-edge
    spec:
      initContainers:
        # busybox is excluded by `migrate.ignore.images` in
        # .chainguard/images.yaml, so this reference should NOT appear in the
        # migration pull request even though the rest of this file does.
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done

      containers:
        - name: edge
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

        - name: log-shipper
          image: fluent/fluent-bit:3.1.9
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true

      volumes:
        - name: varlog
          hostPath:
            path: /var/log
---
apiVersion: v1
kind: Service
metadata:
  name: northwind-edge
  namespace: northwind
spec:
  selector:
    app.kubernetes.io/name: northwind-edge
  ports:
    - name: http
      port: 80
      targetPort: 8080
